<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bienaventurada.doc — Microsoft Word</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=UnifrakturMaguntia&family=Cinzel:wght@400;500;600;700&family=Cinzel+Decorative:wght@400;700&display=swap" rel="stylesheet">
<style>
/* ============ PALETA ============
   rosa pálido   #f2c4d0
   rosa medio    #d4789a
   dorado viejo  #c9a84c
   dorado claro  #e8d080
   pergamino     #fdf3e3
   marrón oscuro #3a1a10
   borgoña       #8b1a4a
================================== */
:root{
  --rosa-palido:#f2c4d0;
  --rosa-medio:#d4789a;
  --dorado:#c9a84c;
  --dorado-claro:#e8d080;
  --pergamino:#fdf3e3;
  --marron:#3a1a10;
  --borgona:#8b1a4a;
}
*{ margin:0; padding:0; box-sizing:border-box; }
html,body{ width:100%; height:100%; overflow:hidden; }
body{
  font-family:'Cinzel', serif;
  color:var(--marron);
  background:
    radial-gradient(ellipse at 20% 15%, rgba(232,160,184,.45), transparent 55%),
    radial-gradient(ellipse at 85% 80%, rgba(201,132,60,.40), transparent 60%),
    radial-gradient(ellipse at 70% 20%, rgba(245,208,144,.55), transparent 50%),
    linear-gradient(135deg, #f5d090 0%, #e8a0b8 48%, #c9843c 100%);
  position:relative;
  min-width:1024px;
  cursor:default;
  user-select:none;
}
/* textura de vitela envejecida */
body::before{
  content:"";
  position:fixed; inset:0;
  pointer-events:none;
  opacity:.5;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='300' height='300'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='3' stitchTiles='stitch'/><feColorMatrix type='saturate' values='0'/></filter><rect width='300' height='300' filter='url(%23n)' opacity='0.16'/></svg>");
  mix-blend-mode:multiply;
  z-index:1;
}
/* manchas de vitela */
body::after{
  content:"";
  position:fixed; inset:0;
  pointer-events:none;
  z-index:1;
  background:
    radial-gradient(circle at 12% 70%, rgba(58,26,16,.10), transparent 18%),
    radial-gradient(circle at 88% 25%, rgba(58,26,16,.08), transparent 15%),
    radial-gradient(circle at 50% 95%, rgba(139,26,74,.07), transparent 20%);
}
#dust{ position:fixed; inset:0; z-index:2; pointer-events:none; }

/* ============ MARGINALIA (esquinas) ============ */
.marginalia{ position:fixed; z-index:3; pointer-events:none; opacity:.85; }
.marginalia svg{ display:block; }
.m-tl{ top:0; left:0; }
.m-tr{ top:0; right:0; transform:scaleX(-1); }
.m-bl{ bottom:38px; left:0; transform:scaleY(-1); }
.m-br{ bottom:38px; right:0; transform:scale(-1,-1); }

/* ============ ÍCONOS DEL ESCRITORIO ============ */
#icons{
  position:fixed; left:14px; top:26px;
  z-index:5;
  display:flex; flex-direction:column; gap:26px;
  width:84px;
}
.icon{
  display:flex; flex-direction:column; align-items:center; gap:5px;
  cursor:pointer;
  padding:6px 2px;
  border:1px solid transparent;
}
.icon:hover{ background:rgba(232,208,128,.25); border:1px dotted var(--dorado); }
.icon svg{ width:42px; height:42px; filter:drop-shadow(1px 2px 2px rgba(58,26,16,.4)); }
.icon span{
  font-family:'Cinzel', serif;
  font-size:8px; font-weight:600;
  letter-spacing:.5px;
  color:var(--pergamino);
  text-align:center;
  text-shadow:1px 1px 2px rgba(58,26,16,.9), 0 0 4px rgba(58,26,16,.6);
}

/* ============ BARRA DE TAREAS ============ */
#taskbar{
  position:fixed; left:0; right:0; bottom:0;
  height:38px; z-index:50;
  border-top:1px solid var(--dorado);
  background:
    url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='120' height='120'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.55' numOctaves='2' stitchTiles='stitch'/><feColorMatrix type='saturate' values='0'/></filter><rect width='120' height='120' filter='url(%23n)' opacity='0.22'/></svg>"),
    linear-gradient(180deg, #5a2a30 0%, #3a1a10 55%, #2a1008 100%);
  display:flex; align-items:center;
  padding:0 10px;
  gap:10px;
  box-shadow:0 -3px 12px rgba(58,26,16,.5);
}
#start-btn{
  display:flex; align-items:center; gap:6px;
  height:28px; padding:0 12px 0 8px;
  background:linear-gradient(180deg, var(--borgona), #5e0f31);
  border:1px solid var(--dorado);
  border-radius:2px;
  color:var(--dorado-claro);
  font-family:'UnifrakturMaguntia', serif;
  font-size:15px;
  cursor:pointer;
  box-shadow:inset 0 1px 0 rgba(232,208,128,.4), 0 1px 3px rgba(0,0,0,.5);
}
#start-btn:hover{ filter:brightness(1.15); }
#start-btn:active{ box-shadow:inset 0 2px 4px rgba(0,0,0,.6); }
.task-sep{
  width:1px; height:24px;
  background:linear-gradient(180deg, transparent, var(--dorado), transparent);
}
.task-item{
  height:26px; padding:0 14px;
  display:flex; align-items:center; gap:6px;
  font-family:'Cinzel', serif;
  font-size:9px; font-weight:600;
  letter-spacing:.4px;
  color:var(--pergamino);
  background:linear-gradient(180deg, rgba(139,26,74,.55), rgba(58,26,16,.55));
  border:1px solid var(--dorado);
  border-radius:2px;
  box-shadow:inset 0 1px 0 rgba(232,208,128,.25);
  cursor:pointer;
}
.task-item .dot{
  width:7px; height:7px; border-radius:50%;
  background:radial-gradient(circle at 35% 30%, var(--dorado-claro), var(--dorado) 60%, #8a6a20);
}
#clock{
  margin-left:auto;
  font-family:'Cinzel', serif;
  font-size:11px; font-weight:600;
  letter-spacing:1px;
  color:var(--dorado-claro);
  text-shadow:0 1px 2px rgba(0,0,0,.6);
  padding:0 8px;
  border-left:1px solid rgba(201,168,76,.5);
  height:24px; display:flex; align-items:center;
}

/* ============ VENTANA WORD — EL CÓDICE ============ */
#word-window{
  position:fixed;
  left:112px; right:14px; top:12px; bottom:52px;
  z-index:10;
  display:flex; flex-direction:column;
  border:1px solid var(--dorado);
  box-shadow:0 8px 40px rgba(58,26,16,.55), 0 0 0 1px rgba(58,26,16,.3);
  background:var(--pergamino);
  overflow:hidden;
}
/* --- barra de título --- */
#titlebar{
  height:30px; flex:0 0 30px;
  display:flex; align-items:center;
  background:linear-gradient(90deg, var(--borgona) 0%, #a8366a 35%, var(--dorado) 100%);
  border-bottom:1px solid var(--dorado);
  padding:0 6px;
  position:relative;
}
#titlebar .title{
  position:absolute; left:0; right:0;
  text-align:center;
  font-family:'Cinzel Decorative', serif;
  font-size:12px; font-weight:700;
  color:#fff;
  text-shadow:1px 1px 2px rgba(58,26,16,.8);
  letter-spacing:.5px;
  pointer-events:none;
}
#titlebar .win-btns{ margin-left:auto; display:flex; gap:5px; z-index:2; }
.medallion{
  width:18px; height:18px; border-radius:50%;
  border:1px solid var(--dorado-claro);
  background:radial-gradient(circle at 35% 30%, #a8366a, var(--borgona) 65%, #5e0f31);
  display:flex; align-items:center; justify-content:center;
  cursor:pointer;
  box-shadow:0 1px 2px rgba(0,0,0,.5), inset 0 1px 1px rgba(255,255,255,.25);
}
.medallion:hover{ filter:brightness(1.2); }
.medallion svg{ width:9px; height:9px; }

/* --- barra de menú --- */
#menubar{
  flex:0 0 24px;
  display:flex; align-items:stretch;
  background:#e8d5c0;
  border-bottom:1px solid rgba(201,168,76,.6);
  padding:0 6px;
}
#menubar span{
  display:flex; align-items:center;
  padding:0 10px;
  font-family:'Cinzel', serif;
  font-size:9px; font-weight:600;
  letter-spacing:.6px;
  color:var(--borgona);
  cursor:pointer;
}
#menubar span:hover{ background:rgba(232,208,128,.55); }

/* --- barra de herramientas --- */
#toolbar{
  flex:0 0 32px;
  display:flex; align-items:center;
  gap:3px;
  background:linear-gradient(180deg, var(--pergamino), #f4e6d0);
  border-bottom:1px solid rgba(201,168,76,.6);
  padding:0 8px;
}
.tool{
  width:24px; height:24px;
  display:flex; align-items:center; justify-content:center;
  border:1px solid transparent;
  border-radius:2px;
  cursor:pointer;
}
.tool:hover{ border-color:var(--dorado); background:rgba(232,208,128,.4); }
.tool svg{ width:16px; height:16px; }
.tool-sep{
  width:3px; height:22px; margin:0 5px;
  background:linear-gradient(180deg, var(--dorado-claro), var(--dorado), var(--dorado-claro));
  border-radius:2px;
  box-shadow:0 0 0 1px rgba(58,26,16,.15);
}
.tool-label{
  font-family:'Cinzel Decorative', serif;
  font-size:13px; font-weight:700;
  color:var(--borgona);
  line-height:1;
}

/* --- regla --- */
#ruler{
  flex:0 0 18px;
  background:
    repeating-linear-gradient(90deg,
      transparent 0, transparent 11px,
      rgba(160,110,60,.55) 11px, rgba(160,110,60,.55) 12px),
    repeating-linear-gradient(90deg,
      transparent 0, transparent 95px,
      rgba(139,26,74,.55) 95px, rgba(139,26,74,.55) 96px),
    linear-gradient(180deg, #f4e6d0, var(--pergamino));
  background-size:96px 7px, 96px 13px, 100% 100%;
  background-position:24px bottom, 24px bottom, 0 0;
  background-repeat:repeat-x, repeat-x, no-repeat;
  border-bottom:1px solid rgba(201,168,76,.7);
}

/* --- área de documento --- */
#doc-area{
  flex:1 1 auto;
  overflow-y:auto;
  overflow-x:hidden;
  background:#d8c8c0;
  padding:26px 0 60px 0;
  scrollbar-width:thin;
  scrollbar-color:var(--dorado) #c9b4aa;
}
#doc-area::-webkit-scrollbar{ width:12px; }
#doc-area::-webkit-scrollbar-track{ background:#c9b4aa; }
#doc-area::-webkit-scrollbar-thumb{
  background:linear-gradient(180deg, var(--dorado-claro), var(--dorado));
  border:2px solid #c9b4aa; border-radius:6px;
}
#sheet{
  width:640px; min-height:880px;
  margin:0 auto;
  background:#fefaf5;
  border:1px solid rgba(201,168,76,.55);
  box-shadow:0 4px 22px rgba(58,26,16,.35);
  position:relative;
  padding:64px 56px 72px 56px;
}
/* orla decorativa de la hoja */
#sheet .orla{
  position:absolute; inset:18px;
  pointer-events:none;
}
#sheet .orla .frame{
  position:absolute; inset:0;
  border:1px solid rgba(201,168,76,.65);
}
#sheet .orla .frame::before{
  content:"";
  position:absolute; inset:3px;
  border:1px solid rgba(201,168,76,.35);
}
#sheet .orla svg{ position:absolute; width:34px; height:34px; }
#sheet .orla .c-tl{ top:-6px; left:-6px; }
#sheet .orla .c-tr{ top:-6px; right:-6px; transform:scaleX(-1); }
#sheet .orla .c-bl{ bottom:-6px; left:-6px; transform:scaleY(-1); }
#sheet .orla .c-br{ bottom:-6px; right:-6px; transform:scale(-1,-1); }

#content{
  position:relative;
  user-select:text;
  min-height:200px;
}
.capitular{
  font-family:'Cinzel Decorative', serif;
  font-size:30px; font-weight:700;
  color:var(--borgona);
  text-shadow:1px 1px 0 var(--dorado-claro);
  margin:26px 0 8px 0;
  line-height:1.3;
}
.capitular:first-child{ margin-top:0; }
.verse{
  font-family:'Cinzel', serif;
  font-size:12px; font-weight:500;
  line-height:1.9;
  color:var(--marron);
  white-space:pre-wrap;
  min-height:1.9em;
}
.verse.fade-in{ animation:fadeIn .4s ease both; }
@keyframes fadeIn{ from{ opacity:0; transform:translateY(3px);} to{ opacity:1; transform:none;} }

/* cursor de escritura */
#cursor{
  display:inline-block;
  width:2px; height:1.1em;
  background:var(--borgona);
  vertical-align:text-bottom;
  margin-left:1px;
  animation:blink 1s steps(1) infinite;
}
@keyframes blink{ 0%,55%{ opacity:1; } 56%,100%{ opacity:0; } }

/* --- barra de estado --- */
#statusbar{
  flex:0 0 24px;
  display:flex; align-items:center;
  gap:18px;
  padding:0 14px;
  font-family:'Cinzel', serif;
  font-size:8px; font-weight:600;
  letter-spacing:.8px;
  color:var(--dorado-claro);
  background:
    url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='100' height='100'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.6' numOctaves='2' stitchTiles='stitch'/><feColorMatrix type='saturate' values='0'/></filter><rect width='100' height='100' filter='url(%23n)' opacity='0.2'/></svg>"),
    linear-gradient(180deg, #4a2218, #2e120a);
  border-top:1px solid var(--dorado);
  text-shadow:0 1px 1px rgba(0,0,0,.7);
}
#statusbar .st-sep{ width:1px; height:14px; background:rgba(201,168,76,.45); }
#st-state{ color:var(--rosa-palido); }

@media (prefers-reduced-motion: reduce){
  #cursor{ animation:none; }
  .verse.fade-in{ animation:none; }
}
</style>
</head>

<script>
"use strict";
/* ============================================================
   EL SCRIPTORIUM DIGITAL
============================================================ */

/* ---------- datos: los cuatro poemas ---------- */
const POEMS = [
  { numeral:"I", lines:[
    "Llena eres de gracia",
    "Madre de todas las fieras",
    "en la orilla de mi estante",
    "Con tu aura de encantada",
    "Me cuidás del verano",
    "Mi virgencita de neón",
    "Yo que te saqué de una playa",
    "Llena de caracolas y souvenires",
    "Te digo, bienvenida",
    "Bienvenida al baldío",
    "A la ruta de los peces",
    "Bienvenida a este barrio",
    "Atroz y almidonado"
  ]},
  { numeral:"II", lines:[
    "Virgen luna custodia mi casa",
    "Desde tu ángulo feroz",
    "Te corono con eucaliptos",
    "Te ofrendo mis cabellos, te pido",
    "Virgensísima, te ruego",
    "No me abandones en el páramo del amor",
    "Amontona tus santos",
    "Que me siento indefensa,",
    "afantasmada, hazme un caparazón",
    "Custodia mi ojo esclavo, carnero",
    "Con tus uñas sangre larguísimas,",
    "mi vacío, mi jaula,",
    "Truena mi pecho, plop",
    "dile que vuelva que un",
    "huracán anaranjado vino.",
    "Me peinó.  Me dejó ciega."
  ]},
  { numeral:"III", lines:[
    "Virgen de la corzuela",
    "Recibe este pasto tierno de la orilla de la ruta",
    "Esta gramilla",
    "Bebe del rocío que cubre mis zapatos",
    "Protege a la fauna del fuego",
    "Con mi fe ciega tormenta",
    "te ruego Virgen cierva,",
    "Por mi familia",
    "que nunca nunca falten",
    "Tus dientes en mi mesa"
  ]},
  { numeral:"IV", lines:[
    "Virgen inquieta",
    "Vengo a ofrecerte mis cuchillos",
    "Sé mi sal en la ceguera",
    "Retuerce los intestinos de los vigilantes",
    "Coloca en sus ojos este manto",
    "agonízame, virgensísima",
    "sé el aceite sobre sus pies",
    "posa tu lengua en mi semilla",
    "Llora por mí como un animal",
    "Virgen pomelo blanco",
    "Cae dulce en el otoño",
    "sé mi sal en la ceguera",
    "Sé mi vértigo"
  ]}
];
const VERSE_POOL = POEMS.flatMap(p => p.lines);

/* ---------- referencias DOM ---------- */
const content  = document.getElementById("content");
const docArea  = document.getElementById("doc-area");
const sheet    = document.getElementById("sheet");
const stWords  = document.getElementById("st-words");
const stPage   = document.getElementById("st-page");
const stState  = document.getElementById("st-state");

/* ---------- cursor ---------- */
const cursor = document.createElement("span");
cursor.id = "cursor";

/* ---------- utilidades ---------- */
const sleep = ms => new Promise(r => setTimeout(r, ms));
const rand  = (a,b) => a + Math.random() * (b - a);
const reducedMotion = window.matchMedia("(prefers-reduced-motion: reduce)").matches;

/* líneas vivas del documento: {el, txt} */
let lines = [];
let wordCount = 0;

function setStatus(s){ stState.textContent = s; }

function updateWords(){
  stWords.textContent = "Palabras: " + wordCount;
}
function recountWords(){
  wordCount = lines.reduce((n,l) => {
    const t = l.txt.trim();
    return n + (t ? t.split(/\s+/).length : 0);
  }, 0);
  updateWords();
}
function updatePage(){
  const p = Math.max(1, Math.ceil(sheet.offsetHeight / 1123));
  stPage.textContent = "Página " + p;
}

/* ---------- scroll automático no bloqueante ---------- */
let userIsAway = false;          // el usuario se alejó del fondo
function nearBottom(){
  return docArea.scrollHeight - docArea.scrollTop - docArea.clientHeight < 140;
}
docArea.addEventListener("scroll", () => {
  userIsAway = !nearBottom();
}, { passive:true });

function followScroll(){
  if (!userIsAway) docArea.scrollTop = docArea.scrollHeight;
}

/* ---------- creación de líneas ---------- */
function newLine(className){
  const el = document.createElement("div");
  el.className = className;
  const span = document.createElement("span");
  span.className = "txt";
  el.appendChild(span);
  content.appendChild(el);
  const line = { el, span, txt:"" };
  lines.push(line);
  el.appendChild(cursor);
  return line;
}

/* ---------- fase de escritura ---------- */
async function typeText(line, text, charMin, charMax){
  for (const ch of text){
    line.txt += ch;
    line.span.textContent = line.txt;
    if (/\S/.test(ch) && (line.txt.length === 1 || /\s/.test(line.txt[line.txt.length-2]))) {
      wordCount++;
      updateWords();
    }
    followScroll();
    if (!reducedMotion) await sleep(rand(charMin, charMax));
  }
  updatePage();
}

async function typeNumeral(numeral){
  const line = newLine("capitular");
  await typeText(line, numeral, 60, 110);
}

async function typeVerse(text){
  const line = newLine("verse");
  await typeText(line, text, 30, 80);
  await sleep(rand(150, 300));   // pausa al final del verso
}

/* ---------- fase de borrado ---------- */
async function deleteAll(){
  // como un backspace humano: ráfagas y vacilaciones
  while (lines.length){
    const line = lines[lines.length - 1];
    line.el.appendChild(cursor);
    while (line.txt.length){
      // a veces se mantiene apretado el backspace: ráfaga
      const burst = Math.random() < 0.18 ? Math.min(line.txt.length, 2 + Math.floor(Math.random()*4)) : 1;
      for (let i=0; i<burst && line.txt.length; i++){
        line.txt = line.txt.slice(0, -1);
        line.span.textContent = line.txt;
      }
      followScroll();
      if (!reducedMotion) await sleep(burst > 1 ? rand(8, 14) : rand(12, 20));
    }
    line.el.remove();
    lines.pop();
    recountWords();
    if (lines.length) lines[lines.length-1].el.appendChild(cursor);
    updatePage();
  }
  content.appendChild(cursor);
  wordCount = 0;
  updateWords();
  updatePage();
}

/* ---------- combinatoria sagrada ---------- */
function samplePool(n){
  const idx = VERSE_POOL.map((_,i) => i);
  for (let i = idx.length - 1; i > 0; i--){
    const j = Math.floor(Math.random() * (i+1));
    [idx[i], idx[j]] = [idx[j], idx[i]];
  }
  // sin repetir texto dentro del mismo poema generado
  const out = [];
  const seen = new Set();
  for (const i of idx){
    const v = VERSE_POOL[i];
    if (!seen.has(v)){ seen.add(v); out.push(v); }
    if (out.length === n) break;
  }
  return out;
}

async function fadeInVerse(text){
  const line = newLine("verse fade-in");
  line.txt = text;
  line.span.textContent = text;
  wordCount += text.trim().split(/\s+/).length;
  updateWords();
  followScroll();
  if (!reducedMotion) await sleep(400);
  updatePage();
}

/* ---------- ciclo principal ---------- */
async function main(){
  content.appendChild(cursor);
  await sleep(900);

  /* FASE 1 — escritura */
  setStatus("Escribiendo...");
  for (let p = 0; p < POEMS.length; p++){
    await typeNumeral(POEMS[p].numeral);
    for (const verse of POEMS[p].lines){
      await typeVerse(verse);
    }
    if (p < POEMS.length - 1) await sleep(800);   // pausa entre poemas
  }

  await sleep(2000);

  /* FASE 2 — borrado y combinatoria */
  setStatus("Transmutando...");
  await deleteAll();
  await sleep(500);

  setStatus("Combinatoria sagrada");
  for(;;){
    const verses = samplePool(8);
    for (const v of verses){
      await fadeInVerse(v);
      await sleep(200);
    }
    await sleep(5000);
    setStatus("Transmutando...");
    await deleteAll();
    await sleep(500);
    setStatus("Combinatoria sagrada");
  }
}

/* ---------- reloj ---------- */
function tickClock(){
  const d = new Date();
  const hh = String(d.getHours()).padStart(2,"0");
  const mm = String(d.getMinutes()).padStart(2,"0");
  document.getElementById("clock").textContent = hh + ":" + mm;
}
tickClock();
setInterval(tickClock, 1000);

/* ---------- polvo de oro en suspensión ---------- */
(function goldDust(){
  const canvas = document.getElementById("dust");
  const ctx = canvas.getContext("2d");
  let W, H, motes = [];
  function resize(){
    W = canvas.width  = window.innerWidth;
    H = canvas.height = window.innerHeight;
  }
  resize();
  window.addEventListener("resize", resize);
  const N = 46;
  for (let i = 0; i < N; i++){
    motes.push({
      x: Math.random(), y: Math.random(),
      r: rand(0.6, 2.2),
      vx: rand(-0.012, 0.012), vy: rand(-0.022, -0.005),
      a: rand(0.15, 0.55),
      tw: rand(0.5, 2.5), ph: Math.random() * Math.PI * 2
    });
  }
  if (reducedMotion){
    // estático: una sola pasada
    motes.forEach(m => {
      ctx.beginPath();
      ctx.arc(m.x * W, m.y * H, m.r, 0, Math.PI*2);
      ctx.fillStyle = "rgba(232,208,128," + m.a * 0.6 + ")";
      ctx.fill();
    });
    return;
  }
  let t = 0;
  function frame(){
    t += 0.016;
    ctx.clearRect(0, 0, W, H);
    for (const m of motes){
      m.x += m.vx / 100;
      m.y += m.vy / 100;
      if (m.y < -0.02){ m.y = 1.02; m.x = Math.random(); }
      if (m.x < -0.02) m.x = 1.02;
      if (m.x >  1.02) m.x = -0.02;
      const tw = 0.5 + 0.5 * Math.sin(t * m.tw + m.ph);
      ctx.beginPath();
      ctx.arc(m.x * W, m.y * H, m.r, 0, Math.PI*2);
      ctx.fillStyle = "rgba(232,208,128," + (m.a * tw).toFixed(3) + ")";
      ctx.shadowColor = "rgba(201,168,76,.8)";
      ctx.shadowBlur = 4;
      ctx.fill();
      ctx.shadowBlur = 0;
    }
    requestAnimationFrame(frame);
  }
  frame();
})();

main();
</script>
